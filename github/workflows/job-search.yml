name: Job Matcher Agent

on:
  workflow_dispatch: 

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install chromium
      - run: npx ts-node index.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
